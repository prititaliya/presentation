<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            line-height: 1.6;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #161b22;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .image-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            background: #0d1117;
            border-radius: 8px;
            padding: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .title {
            color: #ffffff;
            margin: 0 0 20px 0;
            font-size: 1.5em;
            text-align: center;
        }
        @media (max-width: 767px) {
            body {
                padding: 20px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title" id="imageTitle">Image Viewer</h1>
        <div class="image-wrapper">
            <img id="mainImage" src="" alt="Image">
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imagePath = urlParams.get('file');
        const imageTitle = urlParams.get('title') || 'Image Viewer';
        
        if (imagePath) {
            document.getElementById('mainImage').src = imagePath;
            document.getElementById('imageTitle').textContent = imageTitle;
            document.title = imageTitle;
        }
    </script>
</body>
</html>
